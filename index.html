<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DON'T CRASH</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1 class="game-logo">DON'T CRASH</h1>

    <div class="webpage-layout">

        <div class="side-panel left-panel">
            <h2>ABILITIES</h2>
            <div class="shop-container">
                
                <div class="shop-card" id="card-shield">
                    <div class="card-key">Q</div>
                    <div class="card-info-wrapper">
                        <span class="material-symbols-rounded ability-card-icon">shield</span>
                        <div class="card-info">
                            <span class="card-title">SHIELD</span>
                            <span class="card-cost">15 COINS</span>
                        </div>
                    </div>
                </div>
                
                <div class="shop-card" id="card-growth">
                    <div class="card-key">W</div>
                    <div class="card-info-wrapper">
                        <span class="material-symbols-rounded ability-card-icon">zoom_in</span>
                        <div class="card-info">
                            <span class="card-title">GROWTH</span>
                            <span class="card-cost">20 COINS</span>
                        </div>
                    </div>
                </div>

                <div class="shop-card" id="card-phase">
                    <div class="card-key">E</div>
                    <div class="card-info-wrapper">
                        <span class="material-symbols-rounded ability-card-icon">landscape_2_off</span>
                        <div class="card-info">
                            <span class="card-title">PHASE</span>
                            <span class="card-cost">25 COINS</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div id="game-container"></div>

        <div class="side-panel right-panel">
            
            <div id="stats-view">
                
                <div class="stat-box">
                    <h2>SCORE</h2>
                    <div class="current-rescue-display">0000</div>
                </div>

                <div class="stat-box">
                    <h2>HIGHSCORE</h2>
                    <div class="score-display">0000</div>
                </div>
                
                <div class="stat-box">
                    <h2>COINS</h2>
                    <div class="coin-display">0000</div>
                </div>

            </div>

            <div id="shop-view" class="hidden">
                <div class="vertical-shop-container">
                    
                    <div class="heli-item owned" id="shop-heli-1">
                        <img class="heli-item-icon" src="assets/sprites/helicopter.png" alt="Start Heli" />
                        <div class="heli-item-info">
                            <span class="heli-item-price-status">OWNED</span>
                        </div>
                    </div>

                    <div class="heli-item locked" id="shop-heli-2">
                        <img class="heli-item-icon" src="assets/sprites/helicopter (1).png" alt="Standard Upgrade" />
                        <div class="heli-item-info">
                            <span class="heli-item-price-status">100 COINS</span>
                        </div>
                    </div>

                    <div class="heli-item locked" id="shop-heli-3">
                        <img class="heli-item-icon" src="assets/sprites/helicopter (2).png" alt="Shield Specialist" />
                        <div class="heli-item-info">
                            <span class="heli-item-price-status">250 COINS</span>
                        </div>
                        <div class="heli-item-badges">
                            <span class="material-symbols-rounded heli-badge-icon">shield</span>
                            <span class="material-symbols-rounded heli-badge-icon">speed_2x</span>
                        </div>
                    </div>

                    <div class="heli-item locked" id="shop-heli-4">
                        <img class="heli-item-icon" src="assets/sprites/helicopter (3).png" alt="Growth Specialist" />
                        <div class="heli-item-info">
                            <span class="heli-item-price-status">250 COINS</span>
                        </div>
                        <div class="heli-item-badges">
                            <span class="material-symbols-rounded heli-badge-icon">zoom_in</span>
                            <span class="material-symbols-rounded heli-badge-icon">speed_2x</span>
                        </div>
                    </div>

                    <div class="heli-item locked" id="shop-heli-5">
                        <img class="heli-item-icon" src="assets/sprites/helicopter (4).png" alt="Phase Specialist" />
                        <div class="heli-item-info">
                            <span class="heli-item-price-status">250 COINS</span>
                        </div>
                        <div class="heli-item-badges">
                            <span class="material-symbols-rounded heli-badge-icon">landscape_2_off</span>
                            <span class="material-symbols-rounded heli-badge-icon">speed_2x</span>
                        </div>
                    </div>

                    <div class="heli-item locked" id="shop-heli-6">
                        <img class="heli-item-icon" src="assets/sprites/helicopter (5).png" alt="Ultimate Upgrade" />
                        <div class="heli-item-info">
                            <span class="heli-item-price-status">1000 COINS</span>
                        </div>
                        <div class="heli-item-badges">
                            <span class="material-symbols-rounded heli-badge-icon">award_star</span>
                        </div>
                    </div>

                </div>
            </div>

            <div class="shop-button-area">
                <button class="menu-button" id="btn-heli-shop">SHOP</button>
            </div>

        </div>

    </div>

    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>

    <script src="js/config.js"></script>

    <script src="js/main.js"></script>
</body>
</html>
